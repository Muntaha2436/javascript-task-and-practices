    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Formatter App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>📝 Text Formatter</h1>
    <label for="usertext">Enter any paragraph</label>
    <textarea id="usertext" placeholder="Type your text here..."></textarea>

    <div class="button-group">
      <button onclick="upperCase()">Uppercase</button>
      <button onclick="lowerCase()">Lowercase</button>
      <button onclick="capitalize()">Capitalize</button>
      <button onclick="bold()">Bold</button>
      <button onclick="italic()">Italic</button>
    </div>

    <div class="output-box">
      <h2>Result:</h2>
      <p id="output"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
